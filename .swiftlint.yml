# SwiftLint configuration. Swift 6.2 compatible, strict.
strict: true

included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - DerivedData
  - "**/Generated"
  - "**/.build"
  - "**/DerivedData"

# Analyzer rules (require `swiftlint analyze`, compile-backed).
analyzer_rules:
  - unused_import
  - unused_declaration

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - last_where
  - joined_default_parameter
  - operator_usage_whitespace
  - optional_enum_case_matching
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - shorthand_optional_binding
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

disabled_rules:
  - identifier_name          # short names are fine in many contexts
  - opening_brace            # SwiftFormat intentionally wraps some multiline declarations
  - trailing_whitespace      # SwiftFormat owns whitespace
  - trailing_comma
  - todo

force_cast: warning
force_try: warning

# Small-file guardrails.
file_length:
  warning: 700
  error: 1000
  ignore_comment_only_lines: true

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 120
  error: 250

cyclomatic_complexity:
  warning: 18
  error: 30
  ignores_case_statements: true

type_name:
  min_length:
    warning: 3
  max_length:
    warning: 60
    error: 80

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

reporter: "xcode"
